services:
  app:
    build:
      context: ..
    restart: unless-stopped
    env_file: ../.env
    environment:
      NODE_ENV: production
      TRUST_PROXY_HOPS: '1'
    expose: ['3000']
    read_only: true
    tmpfs: ['/tmp:size=16m,noexec,nosuid']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.0
    stop_grace_period: 20s
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: '10m', max-file: '3'}
  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443', '443:443/udp']
    environment:
      APP_HOST: ${APP_HOST:?Set APP_HOST to your public hostname}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    logging:
      driver: json-file
      options: {max-size: '10m', max-file: '3'}
volumes:
  caddy_data:
  caddy_config:
